name: Publish release notes

# A release is published only after the complete Verify workflow succeeds for
# a push to main. This prevents an unverified commit from being announced.
on:
  workflow_run:
    workflows: [Verify]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-notes-main-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified release notes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
      RELEASE_ROLE_ID: '1554095354453041333'
      AFTER_SHA: ${{ github.event.workflow_run.head_sha }}
      VERIFY_RUN_URL: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Build release log
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          # CalVer: ISO-style UTC release date plus the verified CI run number.
          VERSION="v$(date -u +%Y.%m.%d).${VERIFY_RUN_NUMBER}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync, readFileSync, writeFileSync } = require('node:fs');

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const after = process.env.AFTER_SHA;
          const repo = process.env.GITHUB_REPOSITORY;
          const run = (args, allowFailure = false) => {
            try {
              return execFileSync(args[0], args.slice(1), { encoding: 'utf8' }).trim();
            } catch (error) {
              if (allowFailure) return '';
              throw error;
            }
          };
          const previousTag = run(['git', 'describe', '--tags', '--abbrev=0', `${after}^`], true);
          const before = previousTag ? run(['git', 'rev-list', '-n', '1', previousTag]) : `${after}^`;
          const range = `${before}..${after}`;
          const commits = run(['git', 'log', '--format=%s|%an', range], true)
            .split('\n')
            .filter(Boolean)
            .map((line) => {
              const separator = line.lastIndexOf('|');
              return { subject: line.slice(0, separator), author: line.slice(separator + 1) };
            });
          const changedFiles = run(['git', 'diff', '--name-only', before, after], true)
            .split('\n').filter(Boolean);
          const stat = run(['git', 'diff', '--shortstat', before, after], true) || 'No file changes reported.';
          const commitDetails = JSON.parse(run(['gh', 'api', `repos/${repo}/commits/${after}`]));
          const author = commitDetails.author ?? event.sender ?? {};
          const pulls = JSON.parse(run([
            'gh', 'api',
            '-H', 'X-GitHub-Api-Version: 2022-11-28',
            `repos/${repo}/commits/${after}/pulls`,
          ], true) || '[]');

          const groups = { 'What’s new': [], 'Fixed & improved': [], Removed: [], Changed: [] };
          for (const commit of commits) {
            const item = `${commit.subject} — ${commit.author}`;
            if (/^(feat|add)(\(.+\))?!?:/i.test(commit.subject)) groups['What’s new'].push(item);
            else if (/^(fix|perf|security)(\(.+\))?!?:/i.test(commit.subject)) groups['Fixed & improved'].push(item);
            else if (/^(remove|delete|deprecate)(\(.+\))?!?:/i.test(commit.subject)) groups.Removed.push(item);
            else groups.Changed.push(item);
          }

          const clip = (value, max) => value.length > max ? `${value.slice(0, max - 1)}…` : value;
          const list = (items, max = 4) => {
            if (!items.length) return '—';
            const visible = items.slice(0, max).map((item) => `• ${item}`);
            if (items.length > max) visible.push(`• +${items.length - max} additional commits`);
            return visible.join('\n');
          };
          const field = (name, items) => ({ name, value: clip(list(items), 1024), inline: false });
          const version = readFileSync(process.env.GITHUB_OUTPUT, 'utf8').match(/version=(.+)/)?.[1] ?? 'release';
          const commitUrl = `https://github.com/${repo}/commit/${after}`;
          const compareUrl = `https://github.com/${repo}/compare/${before}...${after}`;
          const releaseUrl = `https://github.com/${repo}/releases/tag/${version}`;
          const pullList = pulls.length
            ? pulls.slice(0, 4).map((pr) => `• [#${pr.number}](${pr.html_url}) ${pr.title} ← \`${pr.head?.label ?? 'branch'}\``)
            : ['• Direct push to `main`'];
          if (pulls.length > 4) pullList.push(`• +${pulls.length - 4} additional pull requests`);
          const now = Math.floor(Date.now() / 1000);

          const markdownSections = [
            `# AVRXT ${version}`,
            '',
            `**Verified:** [Verify workflow passed](${process.env.VERIFY_RUN_URL})`,
            `**Released:** <t:${now}:F>`,
            `**Commit:** [\`${after.slice(0, 7)}\`](${commitUrl})`,
            '',
            '## What’s new', list(groups['What’s new']),
            '',
            '## Fixed & improved', list(groups['Fixed & improved']),
            '',
            '## Removed', list(groups.Removed),
            '',
            '## Changed', list(groups.Changed),
            '',
            '## Merged pull requests', pullList.join('\n'),
            '',
            `## Files changed (${changedFiles.length})`,
            stat,
            '',
            `[View complete comparison](${compareUrl})`,
          ];
          writeFileSync('release-notes.md', markdownSections.join('\n'));

          const payload = {
            content: `<@&${process.env.RELEASE_ROLE_ID}>`,
            allowed_mentions: { parse: [], roles: [process.env.RELEASE_ROLE_ID] },
            username: 'AVRXT Release Log',
            avatar_url: 'https://cdn.avrxt.dev/logo/avrxt-vector-slash-Photoroom.png',
            embeds: [{
              title: `AVRXT · ${version}`,
              url: releaseUrl,
              description: [
                '```ansi',
                '\u001b[2;32m✓ VERIFIED PRODUCTION RELEASE\u001b[0m',
                '```',
                `**Quality gate:** [Verify passed](${process.env.VERIFY_RUN_URL})`,
                `**Released:** <t:${now}:F> • <t:${now}:R>`,
                `**Commit:** [\`${after.slice(0, 7)}\`](${commitUrl}) • [Full comparison](${compareUrl})`,
              ].join('\n'),
              color: 0x8b5cf6,
              author: {
                name: author.login ? `${author.login} · release author` : 'AVRXT release author',
                url: author.html_url || commitUrl,
                icon_url: author.avatar_url || undefined,
              },
              thumbnail: { url: 'https://cdn.avrxt.dev/logo/avrxt-vector-slash-Photoroom.png' },
              fields: [
                field('✦ What’s new', groups['What’s new']),
                field('✓ Fixed & improved', groups['Fixed & improved']),
                field('− Removed', groups.Removed),
                { name: '↗ Merged from branches', value: clip(pullList.join('\n'), 1024), inline: false },
                {
                  name: `▤ Files changed · ${changedFiles.length}`,
                  value: clip(`${stat}\n${changedFiles.slice(0, 10).map((file) => `• \`${file}\``).join('\n')}${changedFiles.length > 10 ? `\n• +${changedFiles.length - 10} more files` : ''}`, 1024),
                  inline: false,
                },
              ],
              footer: { text: `AVRXT release automation • Verify #${process.env.VERIFY_RUN_NUMBER} passed` },
              timestamp: new Date().toISOString(),
            }],
          };
          writeFileSync('release-discord.json', JSON.stringify(payload));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## ${version}\n\n` +
            `- **Verify:** passed ([run](${process.env.VERIFY_RUN_URL}))\n` +
            `- **Commit:** [\`${after.slice(0, 7)}\`](${commitUrl})\n` +
            `- **Files:** ${changedFiles.length}; ${stat}\n` +
            `- **Pull requests:** ${pulls.length}\n`);
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.version }}" \
            --target "$AFTER_SHA" \
            --title "AVRXT ${{ steps.release.outputs.version }}" \
            --notes-file release-notes.md

      - name: Send Discord release log
        if: ${{ env.DISCORD_RELEASE_WEBHOOK_URL != '' }}
        run: |
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data @release-discord.json \
            "$DISCORD_RELEASE_WEBHOOK_URL"
