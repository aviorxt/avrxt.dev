name: Verify
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx wrangler deploy --dry-run
      - run: npx wrangler deploy --dry-run --config api-worker/wrangler.jsonc
      - run: npx wrangler deploy --dry-run --config unsubscribe-worker/wrangler.jsonc
      - run: npx wrangler deploy --dry-run --config cloudflare/edge-api/wrangler.jsonc
